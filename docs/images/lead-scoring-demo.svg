<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; fill: #ffffff; }
    .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
    .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; fill: #f8fafc; }
  </style>

  <!-- Container -->
  <rect width="900" height="480" rx="20" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>

  <!-- Top bar -->
  <g transform="translate(35, 30)">
    <circle cx="10" cy="10" r="5" fill="#ef4444"/>
    <circle cx="28" cy="10" r="5" fill="#f59e0b"/>
    <circle cx="46" cy="10" r="5" fill="#10b981"/>
    <text x="75" y="14" class="text-body" font-size="12" font-weight="600">AI LEAD SCORING ENGINE &bull; REAL-TIME QUALIFICATION</text>
    <rect x="670" y="-4" width="150" height="26" rx="6" fill="#1e293b"/>
    <text x="745" y="13" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">⚡ AUTO-SCORED (42ms)</text>
  </g>

  <line x1="35" y1="65" x2="865" y2="65" stroke="#1e293b" stroke-width="1"/>

  <!-- Left: Lead Info & Score Dial -->
  <g transform="translate(50, 95)">
    <!-- Avatar / Initial -->
    <rect width="54" height="54" rx="14" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
    <text x="27" y="34" text-anchor="middle" class="text-bold" font-size="20" fill="#60a5fa">SC</text>

    <!-- Name & Meta -->
    <text x="70" y="24" class="text-title" font-size="20">Sarah Connor</text>
    <text x="70" y="44" class="text-body" font-size="13">VP of Operations &bull; Cyberdyne Systems Corp</text>

    <!-- Score Big Display -->
    <g transform="translate(0, 80)">
      <rect width="360" height="130" rx="14" fill="#0b1120" stroke="#1e293b"/>
      
      <!-- Score Circle -->
      <g transform="translate(70, 65)">
        <circle cx="0" cy="0" r="46" fill="none" stroke="#1e293b" stroke-width="8"/>
        <circle cx="0" cy="0" r="46" fill="none" stroke="url(#meterGrad)" stroke-width="8" stroke-dasharray="290" stroke-dashoffset="20" stroke-linecap="round"/>
        <text x="0" y="8" text-anchor="middle" class="text-title" font-size="26">94</text>
        <text x="0" y="24" text-anchor="middle" class="text-body" font-size="9">/ 100</text>
      </g>

      <!-- Grade & Hot status -->
      <g transform="translate(145, 30)">
        <rect width="70" height="28" rx="6" fill="url(#badgeGrad)"/>
        <text x="35" y="19" text-anchor="middle" class="text-bold" font-size="13">GRADE A</text>

        <rect x="80" y="0" width="85" height="28" rx="6" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1"/>
        <text x="122" y="19" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#fbbf24">🔥 HOT LEAD</text>

        <text x="0" y="55" class="text-body" font-size="12">Win Probability: <tspan fill="#34d399" font-weight="bold">88.4%</tspan></text>
        <text x="0" y="75" class="text-body" font-size="12">Est. Deal Value: <tspan fill="#ffffff" font-weight="bold">$65,000</tspan></text>
      </g>
    </g>

    <!-- Signal Breakdown Bars -->
    <g transform="translate(0, 230)">
      <text x="0" y="0" class="text-bold" font-size="12">QUALIFICATION SIGNALS</text>
      
      <!-- Bar 1 -->
      <text x="0" y="24" class="text-body" font-size="11">Budget &amp; Financial Fit</text>
      <text x="320" y="24" class="text-bold" font-size="11" fill="#10b981">96%</text>
      <rect x="0" y="30" width="340" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="30" width="326" height="6" rx="3" fill="#10b981"/>

      <!-- Bar 2 -->
      <text x="0" y="54" class="text-body" font-size="11">Decision Authority (Executive)</text>
      <text x="320" y="54" class="text-bold" font-size="11" fill="#10b981">92%</text>
      <rect x="0" y="60" width="340" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="60" width="312" height="6" rx="3" fill="#10b981"/>

      <!-- Bar 3 -->
      <text x="0" y="84" class="text-body" font-size="11">Engagement &amp; Buying Intent</text>
      <text x="320" y="84" class="text-bold" font-size="11" fill="#f59e0b">89%</text>
      <rect x="0" y="90" width="340" height="6" rx="3" fill="#1e293b"/>
      <rect x="0" y="90" width="302" height="6" rx="3" fill="#f59e0b"/>
    </g>
  </g>

  <!-- Right: AI Reasoning & Action Box -->
  <g transform="translate(450, 95)">
    <!-- AI Explanation Bubble -->
    <rect width="400" height="190" rx="14" fill="#0b1120" stroke="#334155"/>
    <g transform="translate(20, 25)">
      <circle cx="10" cy="10" r="10" fill="#f59e0b"/>
      <text x="10" y="14" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="12" fill="#000">AI</text>
      <text x="30" y="15" class="text-bold" font-size="14" fill="#f59e0b">PLAIN-LANGUAGE AI ANALYSIS</text>

      <text x="0" y="45" class="text-body" font-size="12.5" fill="#cbd5e1">
        <tspan x="0" dy="0">High-priority enterprise prospect. Verified corporate domain,</tspan>
        <tspan x="0" dy="20">commercial solar budget of $65,000 matches our tier-1</tspan>
        <tspan x="0" dy="20">inventory. Inbound referral from partner network with urgent</tspan>
        <tspan x="0" dy="20">procurement timeline (Q4 installation required).</tspan>
      </text>

      <text x="0" y="125" class="text-body" font-size="11" fill="#64748b">
        Trigger: <tspan fill="#94a3b8">Web Inbound Form + Auto-Enriched via laravel-ai-catalog</tspan>
      </text>
    </g>

    <!-- Recommended Next Action Banner -->
    <g transform="translate(0, 210)">
      <rect width="400" height="65" rx="12" fill="rgba(99, 102, 241, 0.12)" stroke="rgba(99, 102, 241, 0.35)"/>
      <text x="18" y="24" font-family="sans-serif" font-weight="800" font-size="11" fill="#818cf8">RECOMMENDED NEXT ACTION</text>
      <text x="18" y="44" class="text-bold" font-size="13" fill="#e0e7ff">Send executive quotation #QT-2026 &amp; book 15-min discovery</text>
    </g>

    <!-- 1-Click Action Buttons -->
    <g transform="translate(0, 295)">
      <rect width="260" height="42" rx="10" fill="#f59e0b"/>
      <text x="130" y="26" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">⚡ Draft AI Follow-up Now</text>

      <rect x="275" y="0" width="125" height="42" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="337" y="26" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#cbd5e1">Re-Calculate</text>
    </g>
  </g>
</svg>
