<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 800; fill: #ffffff; }
    .t-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
    .t-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 700; fill: #f8fafc; }
    .token { font-family: "Courier New", monospace; font-weight: bold; fill: #fbbf24; }
  </style>

  <!-- Container -->
  <rect width="900" height="480" rx="20" fill="url(#compBg)" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>

  <!-- Top bar -->
  <g transform="translate(35, 30)">
    <circle cx="10" cy="10" r="5" fill="#ef4444"/>
    <circle cx="28" cy="10" r="5" fill="#f59e0b"/>
    <circle cx="46" cy="10" r="5" fill="#10b981"/>
    <text x="75" y="14" class="t-body" font-size="12" font-weight="600">MULTICHANNEL AI FOLLOW-UP ASSISTANT &bull; FULL CONTEXT DRAFTER</text>
    <rect x="680" y="-4" width="140" height="26" rx="6" fill="#1e293b"/>
    <text x="750" y="13" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399">&check; BRAND VOICE MATCH</text>
  </g>

  <line x1="35" y1="65" x2="865" y2="65" stroke="#1e293b" stroke-width="1"/>

  <!-- Channel Selector Tabs -->
  <g transform="translate(45, 85)">
    <!-- Active Tab: Email -->
    <rect width="130" height="34" rx="8" fill="#f59e0b"/>
    <text x="65" y="21" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="12" fill="#0f172a">✉️ Email (Long)</text>

    <!-- WhatsApp -->
    <rect x="140" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="205" y="21" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">💬 WhatsApp</text>

    <!-- LinkedIn -->
    <rect x="280" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="345" y="21" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">💼 LinkedIn</text>

    <!-- SMS -->
    <rect x="420" y="0" width="110" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="475" y="21" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">📱 SMS</text>

    <!-- Phone Script -->
    <rect x="540" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="605" y="21" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">📞 Call Script</text>

    <!-- Tone Dropdown -->
    <rect x="685" y="0" width="135" height="34" rx="8" fill="#0b1120" stroke="#f59e0b" stroke-width="1"/>
    <text x="752" y="21" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#fbbf24">Tone: Consultative ▾</text>
  </g>

  <!-- Main Composer Area -->
  <g transform="translate(45, 140)">
    <rect width="810" height="255" rx="12" fill="#0b1120" stroke="#334155"/>

    <!-- Header Fields -->
    <g transform="translate(25, 25)">
      <text x="0" y="0" class="t-body" font-size="12">To: <tspan fill="#f8fafc" font-weight="bold">Sarah Connor &lt;sarah@cyberdyne.io&gt;</tspan></text>
      <text x="480" y="0" class="t-body" font-size="12">Deal: <tspan fill="#60a5fa">Industrial Solar Package ($65,000)</tspan></text>

      <line x1="0" y1="15" x2="760" y2="15" stroke="#1e293b"/>

      <text x="0" y="38" class="t-body" font-size="12">Subject: <tspan fill="#fbbf24" font-weight="bold">Cyberdyne Systems — Follow-up on Turnaround Timeline &amp; Estimate #QT-2026</tspan></text>

      <line x1="0" y1="52" x2="760" y2="52" stroke="#1e293b"/>
    </g>

    <!-- Draft Content -->
    <g transform="translate(25, 105)">
      <text x="0" y="0" class="t-body" font-size="12.5" fill="#e2e8f0" line-height="22">
        <tspan x="0" dy="0">Dear Sarah,</tspan>
        <tspan x="0" dy="24">Following up on our discussion yesterday regarding Cyberdyne's facility expansion in Texas.</tspan>
        <tspan x="0" dy="22">I have synthesized your requirements into our customized commercial proposal <tspan class="token">#QT-2026</tspan>.</tspan>
        <tspan x="0" dy="22">Key highlights aligned with your Q4 operational window:</tspan>
        <tspan x="15" dy="20">&bull; Guaranteed equipment dispatch by Nov 18 with priority shipping</tspan>
        <tspan x="15" dy="20">&bull; Factory SCADA telemetry module included at no additional cost</tspan>
        <tspan x="15" dy="20">&bull; Flexible milestone invoicing (30% deposit / 70% post-commissioning)</tspan>
        <tspan x="0" dy="24">Would Thursday at 2:00 PM EST work for a 15-minute alignment call with our engineering lead?</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Action Bar -->
  <g transform="translate(45, 415)">
    <rect width="180" height="42" rx="10" fill="#f59e0b"/>
    <text x="90" y="26" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#0f172a">&check; Approve &amp; Send</text>

    <rect x="195" y="0" width="130" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="260" y="26" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">Schedule For Later</text>

    <rect x="340" y="0" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="395" y="26" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="12" fill="#cbd5e1">Edit Draft</text>

    <text x="510" y="26" class="t-body" font-size="11">
      Auto-send Guardrail: <tspan fill="#34d399">Active</tspan> &bull; Quiet Hours: <tspan fill="#94a3b8">8 PM - 8 AM Respects recipient timezone</tspan>
    </text>
  </g>
</svg>
