<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="roiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="900" height="420" rx="20" fill="url(#roiBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title -->
  <g transform="translate(45, 40)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="22" fill="#ffffff">MEASURABLE BUSINESS IMPACT &amp; ROI</text>
    <text x="0" y="24" font-family="sans-serif" font-size="13" fill="#94a3b8">How AI Sales Assistant eliminates manual administrative drudgery and drives real revenue growth</text>
  </g>

  <!-- 4 Big Metric Cards -->
  <g transform="translate(45, 95)">
    <!-- Metric 1 -->
    <rect width="185" height="115" rx="14" fill="#0f172a" stroke="#1e293b"/>
    <text x="20" y="44" font-family="sans-serif" font-weight="900" font-size="34" fill="#fbbf24">82%</text>
    <text x="20" y="68" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Time Saved</text>
    <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#64748b">Drafting emails &amp; quotes</text>

    <!-- Metric 2 -->
    <g transform="translate(205, 0)">
      <rect width="185" height="115" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="44" font-family="sans-serif" font-weight="900" font-size="34" fill="#38bdf8">4.2x</text>
      <text x="20" y="68" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Faster Response</text>
      <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#64748b">Instant lead qualification</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(410, 0)">
      <rect width="185" height="115" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="44" font-family="sans-serif" font-weight="900" font-size="34" fill="#34d399">+64%</text>
      <text x="20" y="68" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Win Rate</text>
      <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#64748b">Zero cold lead leakage</text>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(615, 0)">
      <rect width="195" height="115" rx="14" fill="#0f172a" stroke="#1e293b"/>
      <text x="20" y="44" font-family="sans-serif" font-weight="900" font-size="34" fill="#a855f7">$4,200</text>
      <text x="20" y="68" font-family="sans-serif" font-weight="700" font-size="13" fill="#ffffff">Monthly Savings</text>
      <text x="20" y="90" font-family="sans-serif" font-size="11" fill="#64748b">Per sales rep in saved hours</text>
    </g>
  </g>

  <!-- Comparison Table -->
  <g transform="translate(45, 235)">
    <rect width="810" height="150" rx="12" fill="#0b1120" stroke="#1e293b"/>

    <!-- Header -->
    <text x="30" y="32" font-family="sans-serif" font-weight="700" font-size="12" fill="#64748b">WORKFLOW TASK</text>
    <text x="310" y="32" font-family="sans-serif" font-weight="700" font-size="12" fill="#ef4444">OLD MANUAL METHOD</text>
    <text x="560" y="32" font-family="sans-serif" font-weight="700" font-size="12" fill="#10b981">WITH AI SALES ASSISTANT</text>
    <line x1="20" y1="44" x2="790" y2="44" stroke="#1e293b"/>

    <!-- Row 1 -->
    <text x="30" y="70" font-family="sans-serif" font-weight="600" font-size="12" fill="#ffffff">Scoring &amp; Qualifying Inbound Leads</text>
    <text x="310" y="70" font-family="sans-serif" font-size="12" fill="#94a3b8">20-45 mins of manual research</text>
    <text x="560" y="70" font-family="sans-serif" font-weight="700" font-size="12" fill="#34d399">Instant 0-100 score + explanation (35ms)</text>

    <!-- Row 2 -->
    <text x="30" y="100" font-family="sans-serif" font-weight="600" font-size="12" fill="#ffffff">Writing Personalized Follow-up</text>
    <text x="310" y="100" font-family="sans-serif" font-size="12" fill="#94a3b8">15-30 mins per lead or generic spam</text>
    <text x="560" y="100" font-family="sans-serif" font-weight="700" font-size="12" fill="#34d399">Full-context draft in 12s across 5 channels</text>

    <!-- Row 3 -->
    <text x="30" y="130" font-family="sans-serif" font-weight="600" font-size="12" fill="#ffffff">Quotation &amp; Multilingual Invoice PDF</text>
    <text x="310" y="130" font-family="sans-serif" font-size="12" fill="#94a3b8">Manual Word/Excel templates</text>
    <text x="560" y="130" font-family="sans-serif" font-weight="700" font-size="12" fill="#34d399">1-Click Unicode PDF (Bangla/Arabic/EN)</text>
  </g>
</svg>
