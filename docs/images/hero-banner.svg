<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="rgba(245, 158, 11, 0.18)"/>
      <stop offset="100%" stop-color="rgba(245, 158, 11, 0)"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; fill: #ffffff; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: url(#amberGrad); }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; font-size: 16px; }
    .pill { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 32px; fill: #ffffff; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; font-size: 13px; fill: #64748b; }
  </style>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>
  <rect width="1200" height="500" fill="url(#glow)"/>

  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
  </g>

  <!-- Top Pill -->
  <g transform="translate(425, 40)">
    <rect width="350" height="32" rx="16" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#f59e0b"/>
    <text x="35" y="21" class="pill" fill="#fbbf24">ENTERPRISE MODULAR BUSINESS SUITE</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="130" text-anchor="middle" class="title" font-size="48" letter-spacing="-1">AI SALES ASSISTANT</text>
  <text x="600" y="175" text-anchor="middle" class="tagline" font-size="28" letter-spacing="-0.5">Drafts follow-ups, scores leads, and runs your whole business.</text>
  <text x="600" y="210" text-anchor="middle" class="subtext">Turn cold inquiries into won deals automatically &bull; Powered by Laravel 12 &amp; Filament v3 &bull; 76 Switchable Modules</text>

  <!-- Metric Badges Row -->
  <g transform="translate(150, 250)">
    <!-- Card 1: Score -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect width="200" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1"/>
      <circle cx="45" cy="45" r="24" fill="rgba(245, 158, 11, 0.15)"/>
      <text x="45" y="52" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="18" fill="#fbbf24">A</text>
      <text x="85" y="45" class="stat-val">94<tspan font-size="18" fill="#64748b">/100</tspan></text>
      <text x="85" y="65" class="stat-lbl">AI Lead Score</text>
      <text x="25" y="93" font-family="sans-serif" font-weight="600" font-size="11" fill="#34d399">&bull; Instant Signals</text>
    </g>

    <!-- Card 2: Speed -->
    <g transform="translate(230, 0)" filter="url(#shadow)">
      <rect width="200" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="30" y="48" class="stat-val" fill="#38bdf8">12<tspan font-size="18" fill="#94a3b8"> sec</tspan></text>
      <text x="30" y="70" class="stat-lbl">Follow-up Draft</text>
      <text x="30" y="93" font-family="sans-serif" font-weight="600" font-size="11" fill="#38bdf8">&bull; Email / WhatsApp</text>
    </g>

    <!-- Card 3: Modules -->
    <g transform="translate(460, 0)" filter="url(#shadow)">
      <rect width="200" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
      <text x="30" y="48" class="stat-val">76</text>
      <text x="30" y="70" class="stat-lbl">Modular Plugins</text>
      <text x="30" y="93" font-family="sans-serif" font-weight="600" font-size="11" fill="#c084fc">&bull; Toggle ON / OFF</text>
    </g>

    <!-- Card 4: Presets -->
    <g transform="translate(690, 0)" filter="url(#shadow)">
      <rect width="200" height="110" rx="16" fill="url(#cardGrad)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1"/>
      <text x="30" y="48" class="stat-val">11</text>
      <text x="30" y="70" class="stat-lbl">Industry Presets</text>
      <text x="30" y="93" font-family="sans-serif" font-weight="600" font-size="11" fill="#34d399">&bull; 1-Click Launch</text>
    </g>
  </g>

  <!-- Footer Tag -->
  <g transform="translate(0, 420)">
    <line x1="150" y1="0" x2="1050" y2="0" stroke="rgba(255,255,255,0.08)"/>
    <text x="600" y="45" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#64748b">
      Architected &amp; Authored by <tspan fill="#f59e0b" font-weight="bold">Imran Ahmed</tspan> &bull; <tspan fill="#94a3b8">me@imrandev.bd</tspan> &bull; <tspan fill="#38bdf8">https://imrandev.bd</tspan>
    </text>
  </g>
</svg>
